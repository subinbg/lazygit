name: fork-release

# Builds the fork's binaries.
# Pushing a release-<upstream tag>[-suffix] tag (see fork/dev release)
# also tests them and publishes a GitHub Release;
# running the workflow by hand builds the artifacts only.
# Upstream's own workflows are disabled in this repository's Actions settings.
on:
  push:
    tags: ['release-*']
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        run: |
          # the upstream release the fork is based on, e.g. v0.66.2
          upstream="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ref="${GITHUB_REF_NAME#release-}"
          else
            ref="$upstream"
          fi
          echo "version=${ref#v}+fork" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

  image:
    name: Toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: fork/Dockerfile
          provenance: false
          target: base
          cache-from: type=gha,scope=lazygit
          cache-to: type=gha,scope=lazygit,mode=min

  test:
    name: Test (${{ matrix.suite }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: fork/Dockerfile
          provenance: false
          target: test
          no-cache-filters: test
          build-args: TEST_ARGS=${{ matrix.suite }}
          cache-from: type=gha,scope=lazygit

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [linux-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: fork/Dockerfile
          provenance: false
          target: export
          build-args: |
            TARGET=${{ matrix.target }}
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.commit }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=lazygit
      - uses: actions/upload-artifact@v7
        with:
          name: lazygit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify-linux:
    name: Check the Linux binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lazygit-linux-x64
          path: dist
      - name: Check the binary is static and runs
        run: |
          bin=dist/lazygit-linux-x64
          chmod +x "$bin"
          desc="$(file -b "$bin")"
          echo "$desc"
          case "$desc" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "not statically linked" >&2; exit 1 ;;
          esac
          "$bin" --version

  # Not required by the release:
  # GitHub's macOS arm64 runners are sometimes not available at all,
  # and the darwin build is cross-compiled the same way each time.
  verify-darwin:
    name: Check the macOS binary
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lazygit-darwin-arm64
          path: dist
      - name: Check the cross-compiled binary links only system libraries and runs
        run: |
          bin=dist/lazygit-darwin-arm64
          chmod +x "$bin"
          otool -L "$bin"
          libs="$(otool -L "$bin" | tail -n +2 | awk '{print $1}')"
          bad="$(grep -v -e '^/usr/lib/' -e '^/System/Library/' <<<"$libs" || true)"
          [[ -z "$bad" ]] || { echo "non-system libraries linked: $bad" >&2; exit 1; }
          "$bin" --version

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, test, verify-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lazygit-*
          merge-multiple: true
          path: dist
      - name: Pack each binary as lazygit-<ref>-<target>.tar.gz, holding just lazygit
        env:
          REF: ${{ needs.meta.outputs.ref }}
        run: |
          cd dist
          for bin in lazygit-*; do
            target="${bin#lazygit-}"
            chmod +x "$bin"
            mkdir stage && mv "$bin" stage/lazygit
            tar -C stage -czf "lazygit-$REF-$target.tar.gz" lazygit
            rm -r stage
          done
          sha256sum *.tar.gz >SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: lazygit ${{ needs.meta.outputs.ref }}
          files: dist/*
